[project]
name             = "MontagePy"
version          = "2.4.0"
authors          = [{name = "John Good", email = "jcg@ipac.caltech.edu"}]
description      = "Montage toolkit for reprojecting, mosaicking, and displaying astronomical images."
readme           = "README.md"
license          = {file = "LICENSE"}
keywords         = ["astronomy", "astronomical", "image", "reprojection", "mosaic", "visualization"]
dependencies     = ["requests"]
requires-python  = ">=3.9"

[tool.setuptools]
package-dir      = {"" = "src"}
packages         = ["MontagePy", "MontagePy.archive"]

[project.urls]
"Homepage"       = "https://github.com/Caltech-IPAC/Montage"

[build-system]
requires         = ["setuptools", "cython"]
build-backend    = "setuptools.build_meta"

[tool.cibuildwheel]
build            = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip             = "*-musllinux_*"
before-all       = "python -m pip install jinja2 && sh \"{package}/prepare_checkout.sh\""
test-command     = "python \"{project}/tests/montagepy_smoke.py\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment      = {MACOSX_DEPLOYMENT_TARGET = "11.0"}
repair-wheel-command = ""
