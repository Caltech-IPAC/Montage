# Build Montage and run `make test` on every pull request and on pushes
# to main. GCC 13 is the default compiler on the Ubuntu 24.04 runner.
# GCC 15 (C23 by default) runs in an Ubuntu 26.04 container.
# Pull requests also compare output from the base and merge builds.
# A PR meant to change output will fail this job. The log lists differing files.
# The python jobs build and install MontagePy wheels, then run installed-wheel
# regressions for known values and repeatable image and cube pipelines.
# The workflow-lint job checks every workflow with actionlint and zizmor.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          tarball="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
      # actionlint also runs shellcheck on run blocks, but skips it
      # silently if shellcheck is missing, so check for it first.
      - name: actionlint
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      # The token lets zizmor check each pinned SHA against its version
      # comment. It only reads public data.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==$ZIZMOR_VERSION" .github/workflows

  gcc13:
    name: GCC 13 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show compiler
        run: gcc --version | sed -n 1p
      - name: Build
        run: make
      - name: Test
        run: REQUIRE_C23=1 make test

  gcc15:
    name: GCC 15 (Ubuntu 26.04)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show compiler
        run: gcc --version | sed -n 1p
      - name: Build
        run: make
      - name: Test
        run: REQUIRE_C23=1 make test

  output-compare:
    name: Output comparison (Ubuntu 24.04)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build head
        run: make
      - name: Build base
        env:
          BASE_DIR: ${{ runner.temp }}/montage-base
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          make -C "$BASE_DIR"
      - name: Compare output
        env:
          BASE_DIR: ${{ runner.temp }}/montage-base
        run: sh tests/output_compare.sh "$BASE_DIR/bin" bin

  python:
    name: MontagePy (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build Montage
        run: make
      - name: Build wheel
        working-directory: python/MontagePy
        run: |
          python -m pip install build jinja2
          sh make_local.sh
      - name: Install wheel
        run: python -m pip install python/MontagePy/dist/*.whl
      - name: Test
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tests/montagepy_smoke.py"
